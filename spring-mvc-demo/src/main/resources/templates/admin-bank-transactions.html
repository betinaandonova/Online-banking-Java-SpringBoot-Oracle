<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="/css/common.css">
    <link rel="stylesheet" type="text/css" href="/css/nav-side-bar.css">
    <link rel="stylesheet" type="text/css" href="/css/home-common.css">
    <link rel="stylesheet" type="text/css" href="/css/home.css">
    <link rel="stylesheet" type="text/css" href="/css/subscription-history.css">

    <title>Bank Transactions</title>
</head>

<body>

<main>
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('bank-transactions')}"></div>

    <div class="home-section">
        <div class="single-section-box subscriptions-container">

            <div class="table-header admin-table-header">
                <div class="table-actions">
                    <!-- Bank Transactions има само Delete, затова няма Add бутон -->
                </div>
            </div>

            <div class="table-wrapper">
                <table class="styled-table table-extra-wide">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Account IBAN</th>
                        <th>Receiver Phone</th>
                        <th>Receiver IBAN</th>
                        <th>Currency</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="transaction : ${bankTransactions}">

                        <td th:text="${transaction.id}">1</td>

                        <td th:text="${transaction.employee != null ? transaction.employee.name + ' ' + transaction.employee.lastName : '-'}">
                            Ivan Ivanov
                        </td>

                        <td th:text="${transaction.transactionType != null ? transaction.transactionType.transactionTypeName : '-'}">
                            Transfer
                        </td>

                        <td th:text="${transaction.amount}">
                            100.00
                        </td>

                        <td th:text="${transaction.account != null ? transaction.account.iban : '-'}">
                            BG00BANK00000000000000
                        </td>

                        <td th:text="${transaction.receiverPhoneNumber != null ? transaction.receiverPhoneNumber : '-'}">
                            0888123456
                        </td>

                        <td th:text="${transaction.receiverIban != null ? transaction.receiverIban : '-'}">
                            BG00BANK00000000000001
                        </td>

                        <td th:text="${transaction.currency != null ? transaction.currency.currencyShort : '-'}">
                            EUR
                        </td>

                        <td th:text="${transaction.transactionDate}">
                            2026-01-01
                        </td>

                        <td class="action-buttons">
                            <form th:action="@{/admin/bank-transactions/delete/{id}(id=${transaction.id})}"
                                  method="post"
                                  class="delete-form">

                                <button type="button"
                                        class="btn delete-btn"
                                        th:attr="data-delete-name=${'Transaction #' + transaction.id}"
                                        onclick="openDeleteModal(this)">
                                    Delete
                                </button>
                            </form>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/error-popup :: popupMessages}"></div>
    <div th:replace="~{fragments/confirm-delete-modal :: confirmDeleteModal}"></div>
</main>

<div class="footer">
    <p>© 2026 BSA Bank. All rights reserved.</p>
</div>

</body>
</html>
