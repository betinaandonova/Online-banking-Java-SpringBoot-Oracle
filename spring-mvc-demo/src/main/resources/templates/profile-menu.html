<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" type="text/css" href="/css/common.css">
  <link rel="stylesheet" type="text/css" href="/css/nav-side-bar.css">
  <link rel="stylesheet" type="text/css" href="/css/home-common.css">
  <link rel="stylesheet" type="text/css" href="/css/home.css">
  <link rel="stylesheet" type="text/css" href="/css/profile-menu.css">

  <title>Edit Profile</title>
</head>

<body>

<main>

  <div th:replace="~{fragments/user-sidebar :: userSidebar('profile')}"></div>

  <div class="home-section">
    <div class="single-section-box profile-menu">

      <div class="profile-header">
        <img src="/images/istockphoto-522855255-612x612.jpg"
             alt="Profile Picture"
             class="profile-avatar">

        <h2 class="profile-name"
            th:text="${profile.name + ' ' + profile.lastName}">
          Client Name
        </h2>

        <div class="profile-status-role-container">
          <p class="active-profile">ACTIVE</p>
        </div>
      </div>

      <div class="details-section">

        <div class="details-section-container">
          <strong>Name:</strong>
          <p th:text="${profile.name + ' ' + profile.lastName}">
            Name
          </p>
        </div>

        <div class="details-section-container">
          <strong>Phone Number:</strong>
          <p th:text="${profile.phoneNumber}">
            Phone Number
          </p>
        </div>

        <div class="details-section-container">
          <strong>Address:</strong>
          <p th:text="${profile.address}">
            Address
          </p>
        </div>

        <div class="details-section-container">
          <strong>City:</strong>
          <p th:text="${profile.city}">
            City
          </p>
        </div>

        <div class="details-section-container">
          <strong>Country:</strong>
          <p th:text="${profile.country}">
            Country
          </p>
        </div>

      </div>

      <form class="form" th:action="@{/profile/update}" method="post">

        <label for="name">First Name</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="First Name"
               th:value="${profile.name}">

        <label for="lastName">Last Name</label>
        <input type="text"
               id="lastName"
               name="lastName"
               placeholder="Last Name"
               th:value="${profile.lastName}">

        <label for="phoneNumber">Phone Number</label>
        <input type="text"
               id="phoneNumber"
               name="phoneNumber"
               placeholder="Phone Number"
               th:value="${profile.phoneNumber}">

        <label for="address">Address</label>
        <input type="text"
               id="address"
               name="address"
               placeholder="Address"
               th:value="${profile.address}">

        <button type="submit" class="profile-actions-button">
          <p>Save Changes</p>
          <svg width="24"
               height="24"
               viewBox="0 0 24 24"
               fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6L9 17L4 12"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round">
            </path>
          </svg>
        </button>

      </form>

      <a href="/change-password" class="profile-actions-button change-password-button">
        <p>Change Password</p>
        <svg width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M12 17V15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"/>
          <path d="M7 10V8a5 5 0 0 1 10 0v2"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"/>
          <path d="M6 10h12v10H6V10Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"/>
        </svg>
      </a>

    </div>
  </div>

</main>

<div class="footer">
  <p>© 2026 BSA Bank. All rights reserved.</p>
</div>

</body>
</html>
