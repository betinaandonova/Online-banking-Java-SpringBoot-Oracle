<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="/css/common.css">
    <link rel="stylesheet" type="text/css" href="/css/nav-side-bar.css">
    <link rel="stylesheet" type="text/css" href="/css/home-common.css">
    <link rel="stylesheet" type="text/css" href="/css/home.css">

    <title>Change Password</title>
</head>

<body>

<main>
    <div th:replace="~{fragments/user-sidebar :: userSidebar('profile')}"></div>

    <div class="home-section">
        <div class="single-section-box home-profile-information">

            <div class="profile-header">
                <img src="/images/istockphoto-522855255-612x612.jpg"
                     alt="Profile Picture"
                     class="profile-avatar">

                <h2 class="profile-name">Change Password</h2>

                <div class="profile-status-role-container">
                    <p class="active-profile">SECURE AREA</p>
                </div>

                <div class="details-section"></div>
            </div>

            <div th:if="${errorMessage}" class="details-section">
                <div class="details-section-container">
                    <p class="label">Error:</p>
                    <p th:text="${errorMessage}">Error message</p>
                </div>
            </div>

            <div th:if="${successMessage}" class="details-section">
                <div class="details-section-container">
                    <p class="label">Success:</p>
                    <p th:text="${successMessage}">Success message</p>
                </div>
            </div>

            <form th:action="@{/profile/change-password}"
                  method="post"
                  onsubmit="return validatePasswordForm()">

                <div class="profile-info">

                    <div class="details-section-container">
                        <p class="label">Old Password:</p>
                        <input type="password"
                               id="oldPassword"
                               name="oldPassword"
                               placeholder="Enter old password"
                               required>
                    </div>

                    <div class="details-section-container">
                        <p class="label">New Password:</p>
                        <input type="password"
                               id="newPassword"
                               name="newPassword"
                               placeholder="Enter new password"
                               minlength="6"
                               required>
                    </div>

                    <div class="details-section-container">
                        <p class="label">Repeat Password:</p>
                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Repeat new password"
                               minlength="6"
                               required>
                    </div>

                    <div class="details-section-container">
                        <p class="label">Validation:</p>
                        <p id="passwordValidationMessage">Password must be at least 6 characters.</p>
                    </div>

                </div>

                <div class="password-actions">
                    <button type="submit" class="profile-actions-button password-action-button">
                        <p>Save Password</p>
                        <svg class="w-6 h-6 text-gray-800 dark:text-white"
                             aria-hidden="true"
                             xmlns="http://www.w3.org/2000/svg"
                             width="24"
                             height="24"
                             fill="none"
                             viewBox="0 0 24 24">
                            <path stroke="currentColor"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M20 6 9 17l-5-5">
                            </path>
                        </svg>
                    </button>

                    <a href="/profile" class="profile-actions-button password-action-button">
                        <p>Back to Profile</p>
                        <svg class="w-6 h-6 text-gray-800 dark:text-white"
                             aria-hidden="true"
                             xmlns="http://www.w3.org/2000/svg"
                             width="24"
                             height="24"
                             fill="none"
                             viewBox="0 0 24 24">
                            <path stroke="currentColor"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M15 19l-7-7 7-7">
                            </path>
                        </svg>
                    </a>
                </div>

            </form>

        </div>
    </div>
</main>

<div class="footer">
    <p>© 2026 BSA Bank. All rights reserved.</p>
</div>

<script>
    function validatePasswordForm() {
        const oldPassword = document.getElementById("oldPassword").value.trim();
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();
        const message = document.getElementById("passwordValidationMessage");

        if (oldPassword.length === 0) {
            message.textContent = "Old password is required.";
            return false;
        }

        if (newPassword.length < 6) {
            message.textContent = "New password must be at least 6 characters.";
            return false;
        }

        if (newPassword === oldPassword) {
            message.textContent = "New password cannot be the same as old password.";
            return false;
        }

        if (newPassword !== confirmPassword) {
            message.textContent = "New password and repeated password do not match.";
            return false;
        }

        message.textContent = "";
        return true;
    }
</script>

</body>
</html>
