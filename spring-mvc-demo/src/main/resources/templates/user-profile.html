<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="/css/common.css">
    <link rel="stylesheet" type="text/css" href="/css/nav-side-bar.css">
    <link rel="stylesheet" type="text/css" href="/css/home-common.css">
    <link rel="stylesheet" type="text/css" href="/css/home.css">
    <link rel="stylesheet" type="text/css" href="/css/profile-menu.css">

    <title>My Profile</title>
</head>

<body>

<main>

    <div th:replace="~{fragments/user-sidebar :: userSidebar('profile')}"></div>

    <div class="home-section">
        <div class="single-section-box home-profile-information">

            <div class="profile-header">
                <img src="/images/istockphoto-522855255-612x612.jpg"
                     alt="Profile Picture"
                     class="profile-avatar">

                <h2 class="profile-name"
                    th:text="${profile.name + ' ' + profile.lastName}">
                    Name
                </h2>

                <div class="profile-status-role-container">
                    <p class="active-profile">ACTIVE</p>
                </div>

                <div class="profile-status-role-container">
                    <p class="position-text"
                       th:if="${profile.userType == 'EMPLOYEE'}"
                       th:text="${profile.position}">
                        POSITION
                    </p>
                </div>

                <div class="details-section"></div>
            </div>

            <div class="profile-info">

                <div class="details-section-container">
                    <p class="label">First and Last name:</p>
                    <p th:text="${profile.name + ' ' + profile.lastName}">
                        Name
                    </p>
                </div>

                <div class="details-section-container">
                    <p class="label">Phone Number:</p>
                    <p th:text="${profile.phoneNumber}">
                        Phone Number
                    </p>
                </div>

                <div class="details-section-container"
                     th:if="${profile.userType == 'CLIENT'}">
                    <p class="label">Address:</p>
                    <p th:text="${profile.address}">
                        Address
                    </p>
                </div>

                <div class="details-section-container"
                     th:if="${profile.userType == 'CLIENT'}">
                    <p class="label">City:</p>
                    <p th:text="${profile.city}">
                        City
                    </p>
                </div>

                <div class="details-section-container"
                     th:if="${profile.userType == 'CLIENT'}">
                    <p class="label">Country:</p>
                    <p th:text="${profile.country}">
                        Country
                    </p>
                </div>

                <div class="details-section-container"
                     th:if="${profile.userType == 'EMPLOYEE'}">
                    <p class="label">Position:</p>
                    <p th:text="${profile.position}">
                        Position
                    </p>
                </div>

            </div>

            <a href="/profile/change-password" class="profile-actions-button">
                <p>Change Password</p>
                <svg class="w-6 h-6 text-gray-800 dark:text-white"
                     aria-hidden="true"
                     xmlns="http://www.w3.org/2000/svg"
                     width="24"
                     height="24"
                     fill="none"
                     viewBox="0 0 24 24">
                    <path stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M12 17v-2m-5-5V8a5 5 0 0 1 10 0v2M6 10h12v10H6V10Z">
                    </path>
                </svg>
            </a>

        </div>
    </div>

</main>

<div class="footer">
    <p>© 2026 BSA Bank. All rights reserved.</p>
</div>

</body>
</html>
