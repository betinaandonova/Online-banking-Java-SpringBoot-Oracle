<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="/css/common.css">
    <link rel="stylesheet" type="text/css" href="/css/nav-side-bar.css">
    <link rel="stylesheet" type="text/css" href="/css/home-common.css">
    <link rel="stylesheet" type="text/css" href="/css/home.css">
    <link rel="stylesheet" type="text/css" href="/css/subscription-history.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <title>Transaction Types</title>
</head>

<body>
<main>
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('transaction-types')}"></div>

    <div class="home-section">
        <div class="single-section-box subscriptions-container">

            <div class="table-header admin-table-header">
                <div class="table-actions">
                    <form th:action="@{/admin/transaction-types/add}" method="post" class="add-inline-form">

                        <input type="text"
                               id="transactionTypeName"
                               name="transactionTypeName"
                               placeholder="Transaction type name"
                               maxlength="20"
                               required>

                        <button type="submit" class="btn add-btn">+ Add Transaction Type</button>
                    </form>
                </div>
            </div>

            <table class="styled-table">
                <thead>
                <tr>
                    <th>Transaction Type Name</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="type : ${transactionTypes}">

                    <td th:text="${type.transactionTypeName}">
                        Transaction Type Name
                    </td>

                    <td class="action-buttons">
                        <form th:action="@{/admin/transaction-types/delete/{id}(id=${type.id})}"
                              method="post"
                              class="delete-form">

                            <button type="button"
                                    class="btn delete-btn"
                                    th:attr="data-delete-name=${type.transactionTypeName}"
                                    onclick="openDeleteModal(this)">
                                Delete
                            </button>
                        </form>
                    </td>

                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <div th:replace="~{fragments/error-popup :: popupMessages}"></div>
    <div th:replace="~{fragments/confirm-delete-modal :: confirmDeleteModal}"></div>
</main>

<div class="footer">
    <p>© 2026 BSA Bank. All rights reserved.</p>
</div>
</body>
</html>
