<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="/css/common.css">
    <link rel="stylesheet" type="text/css" href="/css/nav-side-bar.css">
    <link rel="stylesheet" type="text/css" href="/css/home-common.css">
    <link rel="stylesheet" type="text/css" href="/css/home.css">
    <link rel="stylesheet" type="text/css" href="/css/subscription-history.css">

    <title>My Bank Accounts</title>
</head>
<body>

<main>

    <div th:replace="~{fragments/user-sidebar :: userSidebar('accounts')}"></div>

    <div class="home-section">

        <div class="single-section-box home-profile-information">

            <div class="default-label-box">
                <p>MY BANK ACCOUNTS</p>
                <p class="active-wallet-status">ACTIVE</p>
            </div>

            <div class="credit-card-image-container">
                <img src="/images/cards.png"
                     alt="Credit Card"
                     class="credit-card-image">
            </div>

            <div class="wallet-accounts-list">

                <div th:if="${#lists.isEmpty(accounts)}" class="wallet-account-card">
                    <p class="wallet-empty-message">You do not have any bank accounts yet.</p>
                </div>

                <div th:each="account : ${accounts}" class="wallet-account-card">

                    <div class="wallet-account-row">
                        <p class="wallet-label">IBAN:</p>
                        <p class="wallet-value" th:text="${account.iban}">IBAN</p>
                    </div>

                    <div class="wallet-account-row">
                        <p class="wallet-label">Currency:</p>
                        <p class="wallet-value"
                           th:text="${account.currency.currencyShort + ' - ' + account.currency.currency}">
                            Currency
                        </p>
                    </div>

                    <div class="wallet-account-row">
                        <p class="wallet-label">Balance:</p>
                        <p class="wallet-value wallet-balance-value"
                           th:text="${#numbers.formatDecimal(account.availability, 1, 2) + ' ' + account.currency.currencyShort}">
                            Balance
                        </p>
                    </div>

                    <a class="profile-actions-button"
                       th:href="@{/client/transactions(accountId=${account.id})}">
                        <p>Show Transactions</p>

                        <svg class="w-6 h-6 text-gray-800 dark:text-white"
                             aria-hidden="true"
                             xmlns="http://www.w3.org/2000/svg"
                             width="24"
                             height="24"
                             fill="none"
                             viewBox="0 0 24 24">
                            <path stroke="currentColor"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M8 20V7m0 13-4-4m4 4 4-4m4-12v13m0-13 4 4m-4-4-4 4"></path>
                        </svg>
                    </a>

                </div>

            </div>

        </div>

    </div>

</main>

<div class="footer">
    <p>© 2026 BSA Bank. All rights reserved.</p>
</div>

</body>
</html>
